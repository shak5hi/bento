name: bento

# ─────────────────────────────────────────────────────────────────────────────
#  CODE PIPELINE   frontend / GitHub ─► api-gateway ─► scan.jobs ─► scanner ─► postgres ─► advisor
#  PROBE PIPELINE  scheduler ─► probe.jobs ─► probers ─► probe.results ─► analyzer ─► timescaledb
#                                                                          └─► alerts ─► notifier
# ─────────────────────────────────────────────────────────────────────────────

x-env: &env
  DATABASE_URL: postgresql://${POSTGRES_USER:-bento}:${POSTGRES_PASSWORD:-bento_dev_password}@postgres:5432/bento
  TIMESCALE_URL: postgresql://${POSTGRES_USER:-bento}:${POSTGRES_PASSWORD:-bento_dev_password}@timescaledb:5432/metrics
  REDIS_URL: redis://redis:6379/0
  PROBE_INTERVAL_SECONDS: ${PROBE_INTERVAL_SECONDS:-60}
  ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  # GitHub App ("Connect GitHub"): see README
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

x-worker: &worker
  restart: unless-stopped
  networks: [backend-net]
  depends_on:
    api-gateway:
      condition: service_healthy # gateway runs the migrations

services:
  # ─────────────── Frontend (nginx) → http://localhost:8080 ───────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: ../backend/docker/frontend.Dockerfile
      additional_contexts:
        dockerfiles: ./docker
      target: production
    container_name: bento-frontend
    ports: ["${FRONTEND_PORT:-8080}:80"]
    restart: unless-stopped
    depends_on: [api-gateway]
    networks: [frontend-net]

  # Vite dev server with hot reload → http://localhost:4000 (docker compose --profile dev up frontend-dev)
  frontend-dev:
    profiles: ["dev"]
    build:
      context: ../frontend
      dockerfile: ../backend/docker/frontend.Dockerfile
      additional_contexts:
        dockerfiles: ./docker
      target: dev
    container_name: bento-frontend-dev
    ports: ["${FRONTEND_DEV_PORT:-4000}:4000"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
      API_PROXY_TARGET: http://api-gateway:8000
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    networks: [frontend-net]

  # ─────────────── API gateway (FastAPI · JWT · HMAC webhooks) → http://localhost:8081 ───────────────
  api-gateway:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args: { SERVICE: api }
    container_name: bento-api-gateway
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    restart: unless-stopped
    ports: ["${GATEWAY_PORT:-8081}:8000"]
    environment:
      <<: *env
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:4000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [frontend-net, backend-net]

  # ─────────────── Probe pipeline ───────────────
  scheduler:
    <<: *worker
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { SERVICE: scheduler } }
    environment: *env

  prober:
    <<: *worker
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { SERVICE: prober } }
    environment: *env
    deploy:
      replicas: ${PROBER_REPLICAS:-2}

  analyzer:
    <<: *worker
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { SERVICE: analyzer } }
    environment: *env

  notifier:
    <<: *worker
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { SERVICE: notifier } }
    environment:
      <<: *env
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # Email alerts + weekly digest (see README). Unsubscribe links are signed with the same key as logins.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      DIGEST_TIMEZONE: ${DIGEST_TIMEZONE:-UTC}
      DIGEST_HOUR: ${DIGEST_HOUR:-8}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}

  # ─────────────── Code pipeline ───────────────
  scanner:
    <<: *worker
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args: { SERVICE: scanner, APT_PACKAGES: "git ca-certificates" }
    environment: *env
    tmpfs: ["/tmp:size=1g"] # clones live in RAM-backed scratch space and vanish on restart

  fixer: # auto-fix pull requests via the GitHub API (never pushes to the default branch)
    <<: *worker
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { SERVICE: fixer } }
    environment: *env

  advisor:
    <<: *worker
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { SERVICE: advisor } }
    environment: *env

  # ─────────────── Data stores ───────────────
  postgres: # projects, findings, incidents, advice, users
    image: postgres:16-alpine
    container_name: bento-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bento_dev_password}
      POSTGRES_DB: bento
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d bento"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend-net]

  timescaledb: # probe results + health history (hypertables)
    image: timescale/timescaledb:2.17.2-pg16
    container_name: bento-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bento_dev_password}
      POSTGRES_DB: metrics
      TIMESCALEDB_TELEMETRY: "off"
    volumes: [timescale_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d metrics"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend-net]

  redis: # streams (queues), scheduler ZSET, EWMA state, dedup keys
    image: redis:7-alpine
    container_name: bento-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend-net]

networks:
  frontend-net: # browser-facing: frontend <-> gateway
  backend-net: # internal: gateway, workers, data stores

volumes:
  postgres_data:
  timescale_data:
  redis_data:
  frontend_node_modules:
