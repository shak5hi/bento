name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # Throwaway databases with trust auth: no passwords or secrets anywhere.
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      timescaledb:
        image: timescale/timescaledb:2.17.2-pg16
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/bento
      TIMESCALE_URL: postgresql://postgres@localhost:5433/metrics
      REDIS_URL: redis://localhost:6379/0
      BENTO_REQUIRE_INTEGRATION: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/shared/requirements.txt
            backend/services/*/requirements.txt
            backend/tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest -ra

  cli:
    name: bento scan (GitHub Action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runs this repository's own action.yml, so the action itself is tested on every change.
      - uses: ./
        with:
          fail-on: critical
          offline: "true"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npx vite build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every service
        working-directory: backend
        run: docker compose build
      - name: Check the production setup
        working-directory: backend
        # placeholders only: this checks the files, nothing is started
        run: BENTO_DOMAIN=bento.example.test JWT_SECRET=placeholder POSTGRES_PASSWORD=placeholder docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
